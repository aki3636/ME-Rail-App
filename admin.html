<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ME-Rail Admin</title>
<style>body{font-family:system-ui;margin:0;background:#eef1f4;color:#17212b}.top{background:#17365d;color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:14px}.table{overflow:auto}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}th{background:#edf1f4}a,button{padding:7px 10px;border:0;border-radius:7px;background:#e6ebf0;text-decoration:none;color:#17212b;cursor:pointer}</style></head><body><header class="top"><h2>ME-Rail Admin</h2><div>Eingegangene Abrechnungen</div></header><div class="wrap"><div class="card"><button onclick="load()">↻ Aktualisieren</button></div><div class="card table"><table><thead><tr><th>ID</th><th>Arbeitnehmer</th><th>Monat</th><th>E-Mail</th><th>Gesamt</th><th>Eingang</th><th>PDF</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>async function load(){let r=await fetch("/api/submissions");if(!r.ok){document.body.innerHTML="<h2 style='padding:20px'>Admin-Anmeldung erforderlich.</h2>";return}let a=await r.json();document.querySelector("#rows").innerHTML=a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.employee)}</td><td>${x.month}</td><td>${esc(x.email||"")}</td><td>${x.total.toFixed(2)} €</td><td>${x.created_at}</td><td><a href="/api/submissions/${x.id}/pdf">PDF</a></td></tr>`).join("")}function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}load()</script></body></html>
